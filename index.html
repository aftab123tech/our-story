<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* *** UPDATED BACKGROUND ***
          This points to your LOCAL 'paper-texture.jpg' file.
        */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfaf5; /* Fallback color */
            background-image: url('paper-texture.jpg');
            background-repeat: repeat;
            /* The static border is REMOVED from the body */
            box-sizing: border-box;
            min-height: 100vh;
        }

        .handwritten-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
        }
        
        /* --- Fade-in Animation --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-load { animation: fadeIn 1s ease-out forwards; }
        .fade-on-scroll { opacity: 0; }
        .fade-in-visible { animation: fadeIn 1s ease-out forwards; }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }
        .delay-5 { animation-delay: 1.0s; }
        .delay-6 { animation-delay: 1.2s; }

        /* --- Pookie Bow Animation --- */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1) rotate(-20deg);
                opacity: 0.9;
            }
            50% {
                transform: scale(1.2) rotate(-30deg);
                opacity: 1;
            }
        }
        .pookie-bow {
            font-size: 5rem; 
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            animation: pulse 1.5s ease-in-out infinite;
            transform: rotate(-20deg);
        }

        /* --- UPDATED: Floral Corner Borders --- */
        .floral-corner {
            position: fixed;
            width: 120px; 
            height: 120px;
            /* z-index raised to 100 to ensure it's on top */
            z-index: 100;
            pointer-events: none; 
        }
        .floral-corner svg {
            width: 100%;
            height: 100%;
        }
        .top-left { top: 0.5rem; left: 0.5rem; }
        .top-right { top: 0.5rem; right: 0.5rem; transform: rotate(90deg); }
        .bottom-left { bottom: 0.5rem; left: 0.5rem; transform: rotate(-90deg); }
        .bottom-right { bottom: 0.5rem; right: 0.5rem; transform: rotate(180deg); }
        
        /* --- NEW: Page Border Divs --- */
        .page-border {
            position: fixed;
            background: #ffffff;
            /* z-index 40 (so it's "under" the flowers) */
            z-index: 40;
        }
        #top-border {
            top: 0; left: 0; right: 0; height: 8px;
            /* Added transition for smooth hiding */
            transition: transform 0.3s ease-out;
        }
        #bottom-border { bottom: 0; left: 0; right: 0; height: 8px; }
        #left-border { top: 0; bottom: 0; left: 0; width: 8px; }
        #right-border { top: 0; bottom: 0; right: 0; width: 8px; }

        /* This class is added by JS to hide the top border */
        .top-border-hidden {
            transform: translateY(-100%);
        }

    </style>
</head>
<body class="text-gray-800">

    <!-- 
      *** NEW: PAGE BORDERS ***
      These divs replace the body border.
    -->
    <div id="top-border" class="page-border"></div>
    <div id="bottom-border" class="page-border"></div>
    <div id="left-border" class="page-border"></div>
    <div id="right-border" class="page-border"></div>
    <!-- *** END OF BORDERS *** -->


    <!-- 
      *** FLORAL CORNERS ***
      (z-index is now 100)
    -->
    <div class="floral-corner top-left">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 0 50 C 0 0, 0 0, 50 0" stroke="#db2777" stroke-width="2" fill="none"/>
            <path d="M 0 25 C 0 0, 0 0, 25 0" stroke="#db2777" stroke-width="1.5" fill="none"/>
            <circle cx="50" cy="0" r="4" fill="#db2777"/>
            <circle cx="25" cy="0" r="2" fill="#db2777"/>
            <circle cx="0" cy="25" r="2" fill="#db2777"/>
        </svg>
    </div>
    <div class="floral-corner top-right">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 0 50 C 0 0, 0 0, 50 0" stroke="#db2777" stroke-width="2" fill="none"/>
            <path d="M 0 25 C 0 0, 0 0, 25 0" stroke="#db2777" stroke-width="1.5" fill="none"/>
            <circle cx="50" cy="0" r="4" fill="#db2777"/>
            <circle cx="25" cy="0" r="2" fill="#db2777"/>
            <circle cx="0" cy="25" r="2" fill="#db2777"/>
        </svg>
    </div>
    <div class="floral-corner bottom-left">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 0 50 C 0 0, 0 0, 50 0" stroke="#db2777" stroke-width="2" fill="none"/>
            <path d="M 0 25 C 0 0, 0 0, 25 0" stroke="#db2777" stroke-width="1.5" fill="none"/>
            <circle cx="50" cy="0" r="4" fill="#db2777"/>
            <circle cx="25" cy="0" r="2" fill="#db2777"/>
            <circle cx="0" cy="25" r="2" fill="#db2777"/>
        </svg>
    </div>
    <div class="floral-corner bottom-right">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M 0 50 C 0 0, 0 0, 50 0" stroke="#db2777" stroke-width="2" fill="none"/>
            <path d="M 0 25 C 0 0, 0 0, 25 0" stroke="#db2777" stroke-width="1.5" fill="none"/>
            <circle cx="50" cy="0" r="4" fill="#db2777"/>
            <circle cx="25" cy="0" r="2" fill="#db2777"/>
            <circle cx="0" cy="25" r="2" fill="#db2777"/>
        </svg>
    </div>
    <!-- *** END OF FLORAL CORNERS *** -->


    <!-- AUDIO ELEMENTS -->
    <audio id="song-main" src="main song.mp3" preload="metadata" loop></audio>
    <audio id="song-1" src="song 1.mp3" preload="metadata" loop></audio>
    <audio id="song-2" src="song 2.mp3" preload="metadata" loop></audio>
    <audio id="song-3" src="song3.mp3" preload="metadata" loop></audio>
    <audio id="song-4" src="song 4.mp3" preload="metadata" loop></audio>
    <!-- END OF AUDIO SECTION -->

    <!-- z-index-10 makes sure content is "above" the white borders but "below" the flowers -->
    <div class="container mx-auto p-5 max-w-4xl relative z-10">

        <!-- Header Section -->
        <header class="text-center my-12 fade-in-load">
            <h1 class="handwritten-title text-pink-600 mb-4">For my minahil</h1>
            <p class="text-xl text-gray-600">A few of my favorite moments with you.</p>
        </header>

        <!-- Main Image Section -->
        <section id="main-pic" data-song-id="song-main" class="mb-16 fade-on-scroll delay-1">
            <div class="bg-white rounded-lg shadow-xl overflow-hidden border-4 border-pink-500">
                <div class="relative">
                    <img 
                      src="main-photo.jpg" 
                      alt="A special moment" 
                      class="w-full h-auto object-cover"
                      onerror="this.src='https://placehold.co/1200x800/fecdd3/db2777?text=Error:+main-photo.jpg+not+found'; this.onerror=null;"
                    >
                    <div class="absolute top-0 left-0 pookie-bow">
                        🎀
                    </div>
                </div>
                <div class="p-6">
                    <p class="text-center text-lg text-gray-700">"This day was perfect."</p>
                </div>
            </div>
        </section>

        <!-- Our Story Section -->
        <section class="mb-16 fade-on-scroll delay-2">
            <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Our Story</h2>
            <div class="bg-white rounded-lg shadow-xl p-8">
                <p class="text-lg leading-relaxed mb-4">
                    I still remember the day we first met...
                </p>
                <p class="text-lg leading-relaxed">
                    Thank you for every laugh.
                </p>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="mb-16">
            <h2 class="text-3xl font-bold text-center mb-6 text-gray-800 fade-on-scroll delay-3">A Few Highlights</h2>
            
            <div class="flex flex-col items-center gap-10">
                
                <!-- Image 1 -->
                <div id="gallery-item-1" data-song-id="song-1" class="w-full max-w-lg bg-white rounded-lg shadow-xl overflow-hidden transform transition duration-300 hover:scale-105 cursor-pointer fade-on-scroll delay-3">
                    <img 
                      src="photo1.jpg" 
                      alt="Gallery image 1" 
                      class="w-full h-auto object-cover"
                      onerror="this.src='https://placehold.co/600x400/fecdd3/db2777?text=Error:+photo1.jpg+not+found'; this.onerror=null;"
                    >
                    <div class="p-4">
                        <p class="text-center text-gray-700">The beach trip!</p>
                    </div>
                </div>

                <!-- Image 2 -->
                <div id="gallery-item-2" data-song-id="song-2" class="w-full max-w-lg bg-white rounded-lg shadow-xl overflow-hidden transform transition duration-300 hover:scale-105 cursor-pointer fade-on-scroll delay-4">
                    <img 
                      src="photo2.jpg" 
                      alt="Gallery image 2" 
                      class="w-full h-auto object-cover"
                      onerror="this.src='https://placehold.co/600x400/fecdd3/db2777?text=Error:+photo2.jpg+not+found'; this.onerror=null;"
                    >
                    <div class="p-4">
                        <p class="text-center text-gray-700">That silly face you make.</p>
                    </div>
                </div>

                <!-- Image 3 -->
                <div id="gallery-item-3" data-song-id="song-3" class="w-full max-w-lg bg-white rounded-lg shadow-xl overflow-hidden transform transition duration-300 hover:scale-105 cursor-pointer fade-on-scroll delay-5">
                    <img 
                      src="photo3.jpg" 
                      alt="Gallery image 3" 
                      class="w-full h-auto object-cover"
                      onerror="this.src='https://placehold.co/600x400/fecdd3/db2777?text=Error:+photo3.jpg+not+found'; this.onerror=null;"
                    >
                    <div class="p-4">
                        <p class="text-center text-gray-700">Best dinner ever.</p>
                    </div>
                </div>
                
                <!-- Image 4 -->
                <div id="gallery-item-4" data-song-id="song-4" class="w-full max-w-lg bg-white rounded-lg shadow-xl overflow-hidden transform transition duration-300 hover:scale-105 cursor-pointer fade-on-scroll delay-6">
                    <img 
                      src="photo4.jpg" 
                      alt="Gallery image 4" 
                      class="w-full h-auto object-cover"
                      onerror="this.src='https://placehold.co/600x400/fecdd3/db2777?text=Error:+photo4.jpg+not+found'; this.onerror=null;"
                    >
                    <div class="p-4">
                        <p class="text-center text-gray-700">Just us.</p>
                    </div>
                </div>

            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center my-12 text-gray-500 fade-on-scroll delay-6">
            <p>Made with ❤️ by Meesum</p>
        </footer>

    </div>

    <!-- JAVASCRIPT FOR ANIMATIONS AND SCROLLING MUSIC -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // --- 1. Animation Code (For fade-in effects) ---
            const animationObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('fade-in-visible');
                        animationObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 }); 

            document.querySelectorAll('.fade-on-scroll').forEach(el => {
                animationObserver.observe(el);
            });

            // --- 2. Auto-Play Music Logic ---
            let isAudioUnlocked = false; 
            let currentSongToPlay = null; 
            
            const songs = {
                'song-main': document.getElementById('song-main'),
                'song-1': document.getElementById('song-1'),
                'song-2': document.getElementById('song-2'),
                'song-3': document.getElementById('song-3'),
                'song-4': document.getElementById('song-4')
            };

            const galleryItems = [
                document.getElementById('main-pic'),
                document.getElementById('gallery-item-1'),
                document.getElementById('gallery-item-2'),
                document.getElementById('gallery-item-3'),
                document.getElementById('gallery-item-4')
            ];
            
            function pauseAllSongs(exceptThisOne = null) {
                for (const songId in songs) {
                    const song = songs[songId];
                    if (song && song !== exceptThisOne && !song.paused) {
                        song.pause();
                        song.currentTime = 0;
                    }
                }
            }
            
            function playCurrentSong() {
                if (isAudioUnlocked && currentSongToPlay) {
                    pauseAllSongs(currentSongToPlay); 
                    
                    const playPromise = currentSongToPlay.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            // console.error("Audio play error:", error);
                        });
                    }
                }
            }

            const musicObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const songId = entry.target.dataset.songId;
                    const songElement = songs[songId];

                    if (!songElement) return;

                    if (entry.isIntersecting) {
                        currentSongToPlay = songElement;
                        playCurrentSong();
                    } else {
                        if (songElement) {
                            songElement.pause();
                            songElement.currentTime = 0;
                        }
                        if (currentSongToPlay === songElement) {
                            currentSongToPlay = null;
                        }
                    }
                });
            }, { 
                threshold: 0.5 // 50% of the picture must be visible
            });

            function unlockAudio() {
                if (isAudioUnlocked) return; 
                isAudioUnlocked = true;
                playCurrentSong();
            }

            // --- 3. NEW: Hide Top Border on Scroll ---
            const topBorder = document.getElementById('top-border');
            if (topBorder) {
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 20) { // Hides after scrolling 20px
                        topBorder.classList.add('top-border-hidden');
                    } else {
                        topBorder.classList.remove('top-border-hidden');
                    }
                });
            }

            // --- 4. Start Everything ---
            for (const songId in songs) {
                if (songs[songId]) {
                    songs[songId].load();
                }
            }
            galleryItems.forEach(item => {
                if (item) {
                    musicObserver.observe(item);
                }
            });

            window.addEventListener('click', unlockAudio, { once: true });
            window.addEventListener('keydown', unlockAudio, { once: true });
            window.addEventListener('touchstart', unlockAudio, { once: true });

        });
    </script>
</body>
</html>
